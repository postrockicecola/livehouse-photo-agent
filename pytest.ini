[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    requires_ollama: needs a live Ollama endpoint (skipped in CI)
    requires_redis: needs a running Redis broker (skipped in CI)
    requires_langgraph: production LangGraph path — FAIL if langgraph missing (not skip)
    slow: long-running; excluded from the default CI lane
