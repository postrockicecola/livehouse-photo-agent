global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: livehouse-api
    static_configs:
      - targets: ["api:8080"]

  - job_name: livehouse-worker-general
    dns_sd_configs:
      - names: ["celery-worker-general"]
        type: A
        port: 9100
        refresh_interval: 15s

  - job_name: livehouse-worker-vlm
    dns_sd_configs:
      - names: ["celery-worker-vlm"]
        type: A
        port: 9100
        refresh_interval: 15s

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
