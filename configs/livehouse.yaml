# Livehouse Photography AI Processing Pipeline Configuration
# Configuration synced from tests/test_ai.py

# ==============================================================
# PATHS & DIRECTORIES
# ==============================================================
paths:
  # Previews root (gallery + pipeline). Override API dir only: env LIVEHOUSE_GALLERY_PREVIEWS_DIR
  source_dir: "/path/to/Livehouse_Archive/session/Previews"
  work_dir: "./data/livehouse_session"
  
  # Output folders for categorized results
  folders:
    best: "AI_Best_90+"          # Score >= 90
    keep: "AI_Keep_60-90"        # Score 60-90
    trash: "AI_Trash_Below60"    # Score < 60
  
  # Log and tracking files
  log_file: "aesthetic_audit.jsonl"
  progress_file: ".processing_progress.json"
  detailed_audit: "detailed_audit.txt"
  selected_folder: "AI_Selected_Final"
  manual_selected_folder: "manual_selected"

# ==============================================================
# PROCESSING & FILTERING THRESHOLDS (OpenCV Stage 1 & 2)
# ==============================================================
quality_thresholds:
  analysis_long_edge: 1024            # Reference scale for all CV quality metrics
  highlight_luma_threshold: 230
  shadow_luma_threshold: 30
  # Sharpness/Blur Detection
  laplacian_variance_min: 30          # Minimum for non-severe blur
  laplacian_variance_slight_blur: 50  # Threshold for slight blur penalty
  laplacian_variance_medium: 120      # Medium blur level
  laplacian_variance_high: 200        # High quality baseline
  
  # Motion Blur Detection (Sobel gradient asymmetry)
  motion_blur_ratio_threshold: 1.5    # Gradient ratio bounds [0.67, 1.5]
  
  # Exposure Detection
  overexposed_threshold: 0.25         # Max 25% pixels > 230
  overexposed_penalty: 0.15           # Minor penalty threshold
  underexposed_threshold: 0.50        # Max 50% pixels < 30
  underexposed_penalty: 0.35          # Minor penalty threshold
  
  # Contrast Detection
  contrast_min: 10                    # Minimum std deviation
  contrast_penalty: 20                # Penalty threshold
  
  # Content Validation
  brightness_min: 5
  brightness_max: 250
  
  # Edge Detection
  edge_ratio_min: 0.005               # Minimum edge pixels ratio

# ==============================================================
# FAST AESTHETIC ASSESSMENT THRESHOLDS (Stage 2)
# ==============================================================
fast_aesthetic:
  tech_score_min: 32                  # Stage2: stricter technical floor (aggressive cull)
  fast_aesthetic_score_min: 22       # Stage2: stricter fast-aesthetic floor

# ==============================================================
# AI MODEL CONFIGURATION (Ollama + LLaVA)
# ==============================================================
model:
  # provider: ollama | vllm | openai | mock. vllm/openai hit an OpenAI-compatible
  # /v1/chat/completions endpoint (continuous batching server-side); usage tokens are
  # recorded into model_runs just like Ollama. Example vLLM block:
  #   provider: "vllm"
  #   endpoint: "http://localhost:8000"        # or .../v1 ; vllm_endpoints: [...] to round-robin
  #   model_name: "Qwen/Qwen2-VL-7B-Instruct"
  #   api_key: ""                               # only for hosted OpenAI-compatible APIs
  provider: "ollama"
  endpoint: "http://localhost:11434"
  model_name: "qwen2.5vl:7b"
  # Optional: dedicated chat model for the Gallery copilot (text ReAct / tool-calling).
  # ``llava`` is a vision model and follows the tool protocol poorly (skips tools / makes
  # up data); point this at a small instruct model on the SAME provider/endpoint. Empty =
  # reuse ``model_name``. This does NOT affect the VLM scoring pipeline.
  agent_chat_model: "qwen2.5:7b-instruct"
  # Read timeout per HTTP attempt (seconds). LLaVA + 512 tokens often needs 180–300s on CPU.
  timeout: 300
  # Parallel Ollama HTTP workers + admission slots (match single-process LLaVA throughput; avoid fake concurrency).
  # Raise only if Ollama can sustain parallel decodes (e.g. multiple GPU workers / instances).
  # NOTE: Ollama forces Parallel:1 for vision-capable models (server/sched.go — shared vision-token
  # buffers aren't safe under concurrent decode; see docs/OLLAMA_INTEGRATION_NOTES.md §5). Confirmed via
  # server.log for both llava and qwen2.5vl:7b on this box, so >1 here only adds queueing inside Ollama
  # (latency variance, no real throughput gain). Dual qwen2.5vl:7b on 24GB unified memory OOM-rebooted
  # this machine (2026-08-08) — do not re-enable ollama_ports until RAM headroom is verified.
  max_concurrent_requests: 1
  max_inference_queue_size: 1
  # Optional: per-Ollama-model lanes (lane id must match ``model_name`` on requests, or router primary).
  # Omit for single-lane behavior (defaults to primary ``model_name`` with max_* above).
  # inference_lanes:
  #   llava:
  #     num_workers: 2
  #     max_queue_size: 4
  #   "qwen2.5vl:7b":
  #     num_workers: 1
  #     max_queue_size: 2
  # Future: batch multi-image prompts when backend supports it (currently 1 image per call).
  inference_batch_size: 1
  # Optional: multiple Ollama listeners — requests round-robin across instances (see RoundRobinInferenceRouter).
  # Unsafe on 24GB with qwen2.5vl:7b (~13GB/instance); left disabled after OOM reboot.
  # ollama_endpoints:
  #   - "http://localhost:11434"
  #   - "http://localhost:11435"
  # Shorthand (same host):
  # ollama_ports: [11434, 11435]
  # ollama_host: "http://127.0.0.1"
  # If a job waits longer than this (seconds) before a worker *starts* it, degrade (see below).
  queue_wait_timeout_seconds: 120
  # When queue wait exceeded: use this Ollama model tag (e.g. smaller llava). Empty = return error only.
  fallback_model_name: ""
  # Optional token cap when using fallback model (omit = min(num_predict, 256)).
  fallback_num_predict:
  
  # Generation options
  temperature: 0.0                    # Scoring must be deterministic; do not sample rubric scores
  num_predict: 512                    # Max tokens (JSON+comments needs headroom; 180 truncates mid-string)
  
  # Retry configuration
  max_retries: 3
  retry_delay: 1.0                    # Seconds between retries after timeout

# ==============================================================
# EVALUATION WEIGHTS & DIMENSIONS
# ==============================================================
evaluation:
  # Default weights (8-dim Stage 3; sum normalized at runtime if needed).
  # Tilted toward the livehouse-defining dims (moment / atmosphere / light), matching the
  # rubric's "moment_peak + atmosphere_impact are crucial" — a technically clean but flat
  # frame should not out-rank a slightly-soft peak moment. Technical/delivery dims still
  # carry real weight so broken frames lose. Validate changes with scripts/eval before shipping.
  default_weights:
    focus_sharpness: 0.11
    exposure_control: 0.10
    noise_cleanliness: 0.10
    composition_framing: 0.12
    light_color_character: 0.14
    moment_peak: 0.17
    atmosphere_impact: 0.15
    deliverable_subject: 0.11

  # Artistic motion blur: mood + moment over tack-sharp technicals
  artistic_motion_blur_weights:
    focus_sharpness: 0.07
    exposure_control: 0.10
    noise_cleanliness: 0.08
    composition_framing: 0.12
    light_color_character: 0.13
    moment_peak: 0.18
    atmosphere_impact: 0.22
    deliverable_subject: 0.10
  
  # Final score composition
  ai_weight: 0.80                      # 80% AI score
  technical_weight: 0.20               # 20% technical/OpenCV score

# ==============================================================
# CLASSIFICATION THRESHOLDS
# ==============================================================
classification:
  best_threshold: 90                   # Score >= 90 → "Best"
  keep_threshold: 60                   # 60 <= Score < 90 → "Keep"
  selected_threshold: 70               # Score >= 70 for selected collection

# ==============================================================
# PROCESSING CONFIGURATION
# ==============================================================
processing:
  # Stage3 thread cap uses min(max_workers, model.max_inference_queue_size). Stage1/2 can use more CPUs.
  max_workers: 6
  # Optional: fast | balanced | strict | delivery — Stage3 presets (delivery → delivery_mode block)
  # CLI ``--mode`` overrides this after load. Omit both pipeline_mode and stage3_gating fields to admit all.
  # pipeline_mode: balanced

  # Optional override for OpenCV + Stage 2 decode pool (defaults: max( max_workers, min(8, cpu) ))
  stage12_max_workers: 8

  # Enable checkpoint/resume
  enable_checkpoint: true

  # Gallery batch export: ``graded_from_raw/`` = rawpy develop + user film variant (slow, high quality).
  # Override: LIVEHOUSE_EXPORT_FILM_FROM_RAW=0|1
  export_film_from_raw: true
  export_film_jpeg_max_side: 4096
  export_film_raw_max_side: 4096
  export_film_raw_half_size: false
  export_film_jpeg_quality: 95
  export_film_jpeg_subsampling: 0  # 4:4:4，保留舞台灯光与高饱和边缘的颜色细节

  # Session vibe (homepage natural language → film_* preset). Persisted: Previews/runtime/session_vibe.json
  vibe_film:
    enabled: true
    # When keyword rules miss (rules:fallback), call Ollama text-only → JSON film_variant.
    # Override: LIVEHOUSE_VIBE_LLM_ON_MISS=0|1
    llm_on_miss: true
    # Explicit text-only model for this router call. Without this, services/vibe_llm_resolver.py
    # falls back to model.model_name (the Stage3 VLM) — fine for llava, but qwen2.5vl:7b is a
    # heavier vision model for what is a pure-text classification call, so pin it explicitly.
    text_model_name: "qwen2.5:7b-instruct"
    llm_num_predict: 160
    llm_timeout: 90

  # Underexposure salvage lane (Stage1 → Stage2 gating only; VLM still sees original pixels).
  # Dark + structured frames: in-memory EV preview → tech-score rebate / milder fast floor.
  underexposure_salvage:
    enabled: true
    min_edge_ratio: 0.0015
    min_contrast: 4.0
    min_p_range: 12.0
    max_highlight_frac: 0.22
    target_p50: 100.0
    ev_min: 0.35
    ev_max: 6.5          # extreme near-black (p50≈2) needs ~EV5.6 to reach midtones
    preview_min_contrast: 4.0
    preview_min_edge_ratio: 0.0012
    preview_max_highlight_frac: 0.55
    dark_blur_escape_p50_max: 12.0   # p50 at/under this → EV escape before severe-blur hard reject
    dark_blur_escape_min_edge_ratio: 0.00055
    dark_blur_escape_min_preview_laplacian: 380.0
    tech_rebate_shadow_soft: 8.0
    tech_rebate_shadow_heavy: 16.0
    tech_rebate_brightness_low: 5.0
    tech_rebate_cap: 22.0
    fast_aesthetic_score_min: 16.0   # Stage2 fast floor when salvage=true (default 22)

  # Stage2 pre-VLM filters (single decode with fast aesthetic).
  # Hard-reject only unstructured severe blur / extreme blowout; ambiguous livehouse frames
  # (motion, haze, no frontal face, dense crowd, weak bright-centroid) pass with ambiguous_tags.
  stage2_prefilter:
    enabled: true
    laplacian_var_min: 40.0           # Soft band → ambiguous_tags (not hard reject)
    laplacian_var_hard_min: 18.0      # Hard reject only unstructured blur below this
    max_highlight_frac: 0.38          # Soft → ambiguous highlight_hot
    max_shadow_frac: 0.58             # Soft → ambiguous shadow_crush
    reject_motion_blur: false         # motion_blur → ambiguous (VLM decides intent)
    hard_highlight_frac: 0.55         # Hard reject only extreme blowout
    crowd_obstruction_max_faces: 0    # 0 = disable hard crowd kill
    soft_crowd_max_faces: 8           # Dense faces → ambiguous crowd_dense
    composition_min: 36.0             # Soft → ambiguous (bright-centroid proxy fails on gel/backlight)
    tiny_subject_bright_frac_min: 0.0035   # Soft → ambiguous tiny_bright_subject
    require_face: false               # Do not hard-kill atmosphere / silhouette / instrument frames
    face_soft_gate: true              # No Haar face → ambiguous no_face (reserve VLM slot)
    face_min_neighbors: 5
    phash_near_dup:
      enabled: true
      max_hamming: 10                # perceptual hash (pHash) distance for burst / near-dup clustering
      keep_per_cluster: 1            # Only identical decoded pixels are removed before VLM

  # Homepage / ``GET /api/gallery/results``: fold burst frames for browsing (disk unchanged).
  gallery_view_dedupe:
    enabled: true
    max_hamming: 12                   # slightly looser so livehouse lighting drift still folds
    keep_per_cluster: 1              # 精简: one frame per near-dup cluster in the grid

  # ``GET /api/gallery/results?sort=diverse``: semantic-coverage view (disk unchanged).
  # Groups same-scene bursts by CLIP similarity (pHash fallback if open-clip-torch missing),
  # keeps one representative per group, folds the rest as expandable group_members.
  diversity_selection:
    enabled: true
    # Never embed the full gallery inside a request; use pHash unless CLIP is pre-indexed.
    clip_on_demand: false
    # Higher CLIP cosine = harder to merge = smaller clusters (true near-dups / short bursts).
    # 0.85 + single-link previously chained whole stage looks into 「同款 ×300+」.
    similarity_threshold: 0.92
    fallback_phash_hamming: 8         # used only when CLIP embeddings are unavailable
    max_cluster_size: 20              # hard cap ≈ typical burst; opens a new group when full
    max_sync_rows: 1500               # larger sessions fall back to score order; avoids O(n²) request stalls
    max_members_returned: 40          # cap folded frames returned per group (payload guard)
    mmr_lambda: 0.65                  # display order: quality vs spread (1=pure score, 0=max spread)
    representative_dims:              # in-cluster rep pick uses dims that vary within a burst
      moment_peak: 0.35
      focus_sharpness: 0.25
      atmosphere_impact: 0.20
      deliverable_subject: 0.20
  # Learn dim weights from homepage selections → ``Previews/runtime/taste_profile.json``
  taste_profile:
    min_liked: 5                     # Min selected images before rebuild / personalized sort

  # Stage3 VLM: reuse only identical file content and matching model/prompts/scoring context.
  stage3_vlm_cache:
    enabled: true
    max_hamming: 0                 # Route B fail-closed: never reuse a semantic pass for a merely similar image
    max_entries: 4096              # LRU cap — prevents unbounded growth across long sessions
    persist_path: ".luma_pipeline_staged/stage3_vlm_cache.json"  # survive restarts; key is content+context hash so cross-session reuse is safe
    load_on_start: true            # when persist_path is set, merge on cache construction

  # Unified Stage3 budget after Stage2 + exact-content dedupe; legacy remains selectable.
  stage3_gating:
    strategy: coverage_budget        # legacy restores threshold + top-k admission below
    candidate_selection:
      budget_ratio: 0.20             # Fraction of ALL Stage2 eligible images
      min_candidates: 48
      group_budget_ratio: 0.25       # Budget floor relative to burst-group count
      # max_candidates: 500          # Optional explicit cost cap; legacy caps do not apply
      representatives_per_burst: 2   # Soft cap, relaxed only to fill the budget
      burst_gap_seconds: 2.5
      burst_hash_distance: 10
      coverage_time_bins: 24
      lane_weights: {quality: 0.80, coverage: 0.10, ambiguous: 0.07, exploration: 0.03}
    # Explicit pipeline_mode uses its ratio as the single budget (without the floors above).
    # Legacy strategy settings:
    dynamic_batch_gating: true        # scale top-k by job size + distribution-based threshold
    stage3_threshold: 0.60            # slightly looser so haze/motion keepers stay in pool
    top_k_ratio: 0.28                 # multiplied by batch scale (>1000 → tighter); see max_candidates
    max_candidates: 30                # Base budget; scale for larger sessions up to the limit
    candidate_budget_per_1000: 30
    max_candidates_limit: 120
    diversity_reserve: 8              # Reserve coverage across capture order and lighting
    ambiguous_reserve: 8              # preserve difficult motion/haze candidates inside the cap
    estimated_vlm_seconds_per_image: 22.0   # for est. GPU time saved in logs
    # Optional overrides: dynamic_percentile_floor, dynamic_z_sigma, dynamic_threshold_cap

  # Stage routing
  stages:
    stage1_description: "OpenCV strict quality filtering (blur, exposure, contrast)"
    stage2_description: "Fast aesthetic assessment (low-quality rejection)"
    stage3_description: "Deep AI analysis (dimensional scoring)"

# ==============================================================
# STAGE 3 VLM — DUAL MODE (fast scoring + selective full rubric)
# ==============================================================
stage3:
  # Route B: Stage1/2 stay local; only the compressed candidate pool reaches
  # DashScope. The cloud emits semantic observations for ranking/review only.
  route_b:
    enabled: true
    provider: "openai"
    endpoint: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model_name: "qwen3-vl-plus"
    api_key_env: "DASHSCOPE_API_KEY"   # secret is read from env, never stored in YAML
    temperature: 0.0
    num_predict: 1024
    timeout: 180
    # Cross-API failover owns the second chance; avoid multiplying provider retries.
    max_retries: 0
    retry_delay: 1.0
    # Cloud (DashScope) in-flight requests. Independent of the local Ollama fallback
    # lane below (fallback.max_concurrent_requests stays 1 for 24GB OOM safety); raising
    # this only parallelizes cloud calls. Drop to 6 if DashScope returns 429s.
    max_concurrent_requests: 8
    # Admission slots ≈ 2× workers so futures don't block on admission.acquire before
    # the workers drain them. Candidate pool is capped (max_candidates_limit:120), so 16 is safe.
    max_inference_queue_size: 16
    queue_wait_timeout_seconds: 300
    inference_hard_timeout_seconds: 240
    # Cloud VLM image size. Image tokens scale ~linearly with pixel area, so this is the
    # main cloud cost/latency lever. full = dimensional pass (needs detail); fast = quick
    # rank, smaller is fine. Lowered from 1600; raise toward 2048 only if detail is lost.
    thumbnail_max_side: 1280          # full dimensional pass
    thumbnail_max_side_fast: 896      # fast ranking pass (defaults to min(896, full) if omitted)
    # Optional: token pricing for the per-run cost estimate logged as "stage3 token/cost".
    # Tokens are always summarized; cost is added only when a rate is set. Use your DashScope rate.
    # pricing:
    #   input_per_1m: 1.5     # price per 1M input (prompt) tokens
    #   output_per_1m: 4.5    # price per 1M output (completion) tokens
    #   currency: "CNY"
    # Retryable failures only (timeout/transport/429/5xx) fail over to local Ollama.
    # Auth and request errors (400/401/403) remain visible instead of being masked.
    fallback:
      enabled: true
      provider: "ollama"
      endpoint: "http://localhost:11434"
      model_name: "qwen2.5vl:7b"
      temperature: 0.0
      num_predict: 1024
      timeout: 240
      max_retries: 1
      retry_delay: 1.0
      json_mode: true
      max_concurrent_requests: 1
      circuit_breaker:
        failure_threshold: 3
        recovery_timeout_seconds: 60
  # fast_first: fast VLM ranks every candidate; selective full analysis adds explanations
  # full_only: legacy — dimensional prompt on every candidate (higher latency)
  strategy: fast_first
  # Cap on how many images may run full dimensional VLM per batch (among those that pass early-exit rules).
  full_analysis_top_k: 8
  # Legacy YAML field; fast-first full routing uses code rules (score ≥85, tags, dimensions), not this value.
  full_analysis_score_threshold: 85
  fast_num_predict: 384
  # Keep visible semantic-defect evidence for ranking and human review, but disable
  # all automatic gate decisions in production. The field name stays stable for
  # existing analysis_results consumers.
  semantic_gate:
    enabled: false
    mode: "off"                      # evidence retained; no reject/review policy
    min_clear_confidence: 0.65
    default_min_severity: 2
    default_min_confidence: 0.80
    subjective_min_severity: 3
    subjective_min_confidence: 0.90

  # Graduated, deterministic downrank for occluded frames (mic stand / hand / head /
  # instrument / stage gear blocking the subject). Keys off the semantic_gate
  # observation and is applied once in merge_vlm_and_technical_scores, so it works for
  # fast-only frames too (which have no 8-dim rubric). Independent of semantic_gate
  # above (which stays "off"). penalty = max_penalty * severity_weight * confidence_ramp,
  # subtracted from the final blended score. At max_penalty 45: sev3/conf0.8 → −27
  # (a 90 drops to 63, below Selected 70); sev1 ≈ 0. Lower max_penalty to soften.
  occlusion_penalty:
    enabled: true
    max_penalty: 45.0                # points subtracted at severity 3, confidence 1.0
    min_confidence: 0.50             # below this, no penalty (tentative reports ignored)
    severity_weights:
      1: 0.15
      2: 0.55
      3: 1.00

# Stage4: optional follow-up VLM for Lightroom/Photoshop editing_suggestions (after full Stage3 rubric).
stage4_editing:
  enabled: true
  mode: numeric                   # numeric = machine-appliable grade (Automated); text = human suggestions
  num_predict: 384
  min_score: 0                    # skip Stage4 when Stage3 score below this
  skip_on_fallback_defaults: true # skip when Stage3 parsing failed
  skip_on_cache_hit: true         # do not re-run Stage4 when Stage3 VLM cache hit

# ==============================================================
# DELIVERY MODE (--mode delivery) — opt-in throughput preset
# ==============================================================
# Stage1: unchanged strict OpenCV thresholds. Stage2: aggressive cull then keep top
# ``stage2_target_ratio`` of survivors for VLM. Stage3: fast_first; dimensional
# FULL on at most ``full_top_k``. Set ``quiet_logs: false`` for verbose stdout.
delivery_mode:
  stage2_target_ratio: 0.12
  stage3_normalized_threshold: 0.72    # Stage2 norm floor before top-k slice (0–1)
  stage3_fast_only: true               # use fast_first (not full_only); still up to full_top_k FULL
  full_top_k: 5
  fast_num_predict: 180                # optional: shorter fast VLM generations
  quiet_logs: true

# ==============================================================
# OBSERVABILITY — per-image pipeline traces (JSONL) + optional OTEL
# ==============================================================
# Enable tracing: observability.pipeline_tracing.enabled: true
# Or env LIVEHOUSE_PIPELINE_TRACE=1
# Debug single image: LIVEHOUSE_PIPELINE_TRACE_DEBUG=1 and LIVEHOUSE_PIPELINE_TRACE_IMAGE=IMG_123.jpg
observability:
  pipeline_tracing:
    enabled: false
    emit_jsonl: true
    debug: false
    debug_image: ""
  opentelemetry:
    # LIVEHOUSE_OTEL=1 configures the process exporter and enables pipeline spans.
    # This flag enables pipeline spans when a TracerProvider is configured externally.
    # Optional OTEL_EXPORTER_OTLP_ENDPOINT; otherwise console exporter.
    # Collector/Tempo/Prometheus/Alertmanager/Grafana: deploy Compose "observability" profile.
    enabled: false
    tracer_name: "livehouse.pipeline"

# ==============================================================
# AI EVALUATION PROMPT
# ==============================================================
ai_prompt: |
  You are a professional music photographer critic evaluating Livehouse photos.
  Score eight dimensions 0-10 with varied numbers (not flat 7,7,7,...).

  1. focus_sharpness — focus/readability; intentional motion blur can still score fairly if readable.
  2. exposure_control — exposure, highlight/shadow detail, harsh stage contrast.
  3. noise_cleanliness — noise, banding, artifacts, mushy denoise.
  4. composition_framing — framing, horizon, balance, accidental crops.
  5. light_color_character — light sculpting + color mood (beyond exposure correctness).
  6. moment_peak — decisive instant, gesture/expression peak.
  7. atmosphere_impact — crowd/stage energy, emotional storytelling.
  8. deliverable_subject — client-ready subject: face usable, pose, blocking/occlusion.

  Livehouse: moment_peak + atmosphere_impact are crucial; do not over-penalize intentional blur.

  Return compact JSON only:
  {"focus_sharpness": <0-10>, "exposure_control": <0-10>, "noise_cleanliness": <0-10>,
   "composition_framing": <0-10>, "light_color_character": <0-10>, "moment_peak": <0-10>,
   "atmosphere_impact": <0-10>, "deliverable_subject": <0-10>,
   "strongest_aspect": "<detail>", "tags": ["tag1"]}
